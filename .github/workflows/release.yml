name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.12'
      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python -c 'import os, tomllib; version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; assert os.environ["RELEASE_TAG"] == "v" + version, "Release tag/version mismatch"'
      - run: uv sync --extra dev --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
      - name: Verify published version through desktop auto-updater
        run: python scripts/verify_pypi.py
  macos:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/macos.yml
    with:
      release_tag: ${{ github.event.release.tag_name || '' }}
