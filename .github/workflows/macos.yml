name: macOS package
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  package:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.12'
      - name: Check release tag matches package version
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python -c 'import os, tomllib; version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; assert os.environ["RELEASE_TAG"] == "v" + version, "Release tag/version mismatch"'
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Verify PyPI auto-update on macOS
        if: inputs.release_tag != ''
        run: python scripts/verify_pypi.py
      - run: bash scripts/build_macos.sh
      - run: uv run python scripts/build_mcpb.py
      - run: cd dist && shasum -a 256 ./*.mcpb >> SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flin-chatgpt-ads-mcp-macos
          path: dist/
      - if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/*.pkg dist/*.zip dist/*.mcpb dist/SHA256SUMS
